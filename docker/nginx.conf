# Single-port front door for the eval framework container.
#
#   0.0.0.0:8501 (the ONLY exposed port)
#     /auth/*  -> FastAPI  127.0.0.1:8100  (path passed through UNMODIFIED —
#                 these are real service routes; Host is forwarded so
#                 service/auth._redirect_uri derives the browser-facing
#                 http://localhost:8501/auth/callback, the registered URI)
#     /api/*   -> FastAPI  127.0.0.1:8100  with the /api prefix STRIPPED
#                 (/api/health -> /health); buffering off for SSE
#     /        -> Streamlit 127.0.0.1:8601 with websocket upgrade support

# Runs as the unprivileged `app` user: pid + temp paths live under /tmp.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OAuth callbacks carry authorization codes in the query; never log them.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
    access_log /dev/stdout safe;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Websocket-aware Connection header (Streamlit's /_stcore/stream).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A TLS-terminating proxy in front (load balancer / ingress) sets X-Forwarded-Proto: https.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    client_max_body_size 100m;

    server {
        listen 0.0.0.0:8501;

        location = /_eval_auth {
            internal;
            proxy_pass http://127.0.0.1:8100/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /api/health {
            proxy_pass http://127.0.0.1:8100/health;
        }

        # --- FastAPI auth routes: pass through unmodified -------------------
        location /auth/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- FastAPI API: trailing slash on proxy_pass strips /api/ ---------
        location /api/ {
            auth_request /_eval_auth;
            proxy_pass http://127.0.0.1:8100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;          # SSE: flush events immediately
            proxy_read_timeout 3600s;     # long-running eval runs
        }

        # --- Everything else: Streamlit (HTTP + websocket) ------------------
        location / {
            proxy_pass http://127.0.0.1:8601;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;     # keep the app websocket alive
        }
    }
}
